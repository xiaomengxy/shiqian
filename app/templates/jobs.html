{% extends "base.html" %}
{% block title %}拾签 · 解析队列{% endblock %}
{% block content %}
<section class="page-heading">
  <div>
    <div class="section-kicker">Queue</div>
    <h1>解析队列</h1>
    <p>任务会在后台处理；确认保存后会标记为已保存，也可以清理进回收站。</p>
  </div>
  <div class="toolbar compact-actions">
    <form method="post" action="/jobs/cleanup" data-async-form data-target="#jobs-list" data-confirm="把已完成、已保存和失败的任务移入回收站？">
      <button class="secondary" type="submit">清理已结束</button>
    </form>
    <a class="button secondary" href="/trash">回收站</a>
    <a class="button" href="/">继续添加</a>
  </div>
</section>

{% include "_jobs_list.html" %}
{% endblock %}
