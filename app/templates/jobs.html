{% extends "base.html" %}
{% block title %}拾签 · 解析队列{% endblock %}
{% block content %}
<section class="page-heading">
  <div>
    <div class="section-kicker">Queue</div>
    <h1>解析队列</h1>
    <p>后台整理进度、待确认任务和失败记录都在这里。</p>
  </div>
  <div class="toolbar compact-actions">
    <form method="post" action="/jobs/cleanup" data-async-form data-target="#jobs-list" data-confirm="把已完成、已保存和失败的任务移入回收站？">
      <button class="secondary" type="submit">清理结束</button>
    </form>
    {% if show_saved %}
      <a class="button secondary" href="/jobs">隐藏已保存</a>
    {% else %}
      <a class="button secondary" href="/jobs?show_saved=1">显示已保存{% if saved_count %} · {{ saved_count }}{% endif %}</a>
    {% endif %}
    <a class="button secondary" href="/trash">回收站</a>
    <a class="button" href="/">继续添加</a>
  </div>
</section>

{% include "_jobs_list.html" %}
{% endblock %}
