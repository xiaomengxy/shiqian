{% extends "base.html" %}
{% block title %}拾签 · 学习{% endblock %}
{% block content %}
<section class="learning-page" data-learning-app>
  <header class="page-head">
    <div>
      <p class="eyebrow">Learning</p>
      <h1>学习</h1>
      <p>Bilibili 收藏夹读取、字幕摘要和 Markdown 笔记生成都放在这里，生成后会进入普通笔记目录树。</p>
    </div>
    <a class="button secondary" href="/">返回笔记</a>
  </header>

  <section class="learning-workbench">
    <aside class="learning-side">
      <section class="learning-box" data-bili-login-box>
        <div class="learning-box-head">
          <div>
            <p class="eyebrow">Account</p>
            <h2>Bilibili 登录</h2>
          </div>
          <button class="secondary" type="button" data-bili-refresh-session>刷新</button>
        </div>
        <div class="bili-login-state" data-bili-login-state>
          <p>正在检查登录状态...</p>
        </div>
      </section>

      <section class="learning-box">
        <div class="learning-box-head">
          <div>
            <p class="eyebrow">Folders</p>
            <h2>收藏夹</h2>
          </div>
          <button type="button" data-bili-load-folders>读取</button>
        </div>
        <div class="bili-folder-list" data-bili-folder-list>
          <p class="muted-text">登录后读取收藏夹。</p>
        </div>
      </section>
    </aside>

    <section class="learning-main">
      <div class="learning-box-head">
        <div>
          <p class="eyebrow">Videos</p>
          <h2 data-bili-current-folder>选择收藏夹</h2>
        </div>
        <div class="toolbar-actions">
          <button class="bili-overwrite-switch secondary" type="button" data-bili-overwrite-toggle aria-pressed="false">
            <span>重新生成</span>
            <span class="switch-track" aria-hidden="true"><span></span></span>
          </button>
          <button class="secondary" type="button" data-bili-select-all>全选</button>
          <button class="secondary danger ghost" type="button" data-bili-cancel-import hidden>中断</button>
          <button type="button" data-bili-import-selected>生成笔记</button>
        </div>
      </div>
      <div class="bili-video-list" data-bili-video-list>
        <section class="empty-panel compact">
          <h2>还没有视频</h2>
          <p>先登录并读取一个收藏夹。</p>
        </section>
      </div>
      <div class="bili-import-log" data-bili-import-log hidden></div>
    </section>
  </section>
</section>
{% endblock %}
