{% extends "base.html" %}
{% block title %}拾签 · 目录{% endblock %}
{% block content %}
<section class="panel">
  <div class="panel-head">
    <h1>目录</h1>
    <p>目录支持任意层级，用 / 分隔。</p>
  </div>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/directories" class="toolbar">
    <input name="path" placeholder="技术/AI/提示词">
    <button type="submit">新增目录</button>
  </form>
</section>

<section class="panel">
  <h2>目录树</h2>
  <div class="directory-list">
    {% for directory in directories %}
      <div class="directory-row" style="--depth: {{ directory.depth }}">
        <strong>{{ directory.path }}</strong>
        <form method="post" action="/directories/{{ directory.id }}/rename">
          <input name="name" value="{{ directory.name }}">
          <button type="submit">重命名</button>
        </form>
        <form method="post" action="/directories/{{ directory.id }}/move">
          <select name="parent_id">
            <option value="">根目录</option>
            {% for parent in directories %}
              {% if parent.id != directory.id %}
                <option value="{{ parent.id }}" {% if directory.parent_id == parent.id %}selected{% endif %}>{{ parent.path }}</option>
              {% endif %}
            {% endfor %}
          </select>
          <button type="submit">移动</button>
        </form>
      </div>
    {% else %}
      <p class="muted">目录为空，保存收藏时会自动创建。</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
