{% extends "base.html" %}
{% block title %}拾签 · 目录{% endblock %}
{% block content %}
<section class="page-heading">
  <div>
    <div class="section-kicker">Taxonomy</div>
    <h1>目录管理</h1>
    <p>目录只负责主归档位置；标签用于跨目录检索。想看条目，请从资料库进入。</p>
  </div>
  <a class="button secondary" href="/bookmarks">打开资料库</a>
</section>

<section class="panel">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/directories" class="toolbar" data-async-form data-target="#directory-workspace">
    <input name="path" placeholder="技术/AI/提示词">
    <button type="submit">新增目录</button>
  </form>
</section>

{% include "_directories_workspace.html" %}
{% endblock %}
