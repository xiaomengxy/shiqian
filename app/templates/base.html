<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}拾签{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}?v=notes-pointer-drag2">
  </head>
  <body>
    {% set current = active_nav if active_nav is defined else "" %}
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">拾</span>
        <span>
          <strong>拾签</strong>
          <small>Markdown Notes</small>
        </span>
      </a>
      <nav class="top-nav" aria-label="主导航">
        <a class="{% if current == 'notes' %}active{% endif %}" href="/">笔记</a>
        <a class="{% if current == 'trash' %}active{% endif %}" href="/trash">回收站</a>
        <a class="{% if current == 'settings' %}active{% endif %}" href="/settings">设置</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='/vendor/markdown-it.min.js') }}?v=notes-pointer-drag2"></script>
    <script src="{{ url_for('static', path='/app.js') }}?v=notes-pointer-drag2" defer></script>
  </body>
</html>
