<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}拾签{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}?v=notes-learning1">
  </head>
  {% set current = active_nav if active_nav is defined else "" %}
  <body data-active-nav="{{ current }}">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">拾</span>
        <span>
          <strong>拾签</strong>
          <small>Markdown Notes</small>
        </span>
      </a>
      <div class="top-actions">
        <a class="top-learning-link {% if current == 'learning' %}active{% endif %}" href="/learning">学习</a>
        <a class="top-note-link {% if current == 'notes' %}active{% endif %}" href="/">笔记</a>
        <button class="top-menu-button secondary" type="button" data-feature-menu aria-haspopup="menu" aria-expanded="false">功能</button>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='/vendor/markdown-it.min.js') }}?v=notes-learning1"></script>
    <script src="{{ url_for('static', path='/app.js') }}?v=notes-learning1" defer></script>
  </body>
</html>
