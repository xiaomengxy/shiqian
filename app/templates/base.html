<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}拾签{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}?v=drawer-drop-items">
  </head>
  <body>
    <div class="page-grain" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">拾</span>
        <span>
          <strong>拾签</strong>
          <small>Capture Library</small>
        </span>
      </a>
      <nav>
        <a href="/">添加</a>
        <a href="/jobs">队列</a>
        <a href="/bookmarks">收藏</a>
        <a href="/trash">回收站</a>
        <a href="/settings">设置</a>
      </nav>
    </header>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='/app.js') }}?v=drawer-drop-items" defer></script>
  </body>
</html>
