{% extends "base.html" %}
{% block title %}拾签 · 笔记{% endblock %}
{% block content %}
<section class="notes-app" data-notes-app>
  <aside class="notes-sidebar">
    <div class="sidebar-head">
      <div>
        <p class="eyebrow">Library</p>
        <h1>笔记</h1>
      </div>
      <div class="sidebar-actions">
        <button type="button" class="secondary" data-new-directory>新目录</button>
        <button type="button" data-new-note>新建</button>
      </div>
    </div>

    <label class="search-box">
      <span>搜索</span>
      <input type="search" data-note-search placeholder="标题、正文或来源链接">
    </label>

    <div class="tree-root-drop" data-directory-drop data-directory-id="">
      <span>未分类</span>
      <small data-root-count></small>
    </div>
    <nav class="note-tree" data-note-tree aria-label="目录和笔记"></nav>
  </aside>

  <article class="note-stage">
    <section class="empty-panel" data-empty-panel>
      <p class="eyebrow">Markdown Notes</p>
      <h2>从一条笔记开始。</h2>
      <p>左侧是目录和条目，右侧专心阅读或编辑 Markdown。后续的视频、链接和解析内容也会先落到这里。</p>
      <button type="button" data-new-note>新建笔记</button>
    </section>

    <section class="reader-panel" data-reader-panel hidden>
      <div class="note-toolbar">
        <div>
          <p class="eyebrow" data-note-source-label>未分类</p>
          <h2 data-note-title></h2>
          <a data-note-source href="#" target="_blank" rel="noreferrer" hidden></a>
        </div>
        <div class="toolbar-actions">
          <button class="secondary" type="button" data-edit-note>编辑</button>
          <button class="danger ghost" type="button" data-delete-note hidden>删除</button>
        </div>
      </div>
      <div class="markdown-body" data-note-rendered></div>
      <p class="timestamp" data-note-updated></p>
    </section>

    <section class="editor-panel" data-editor-panel hidden>
      <form data-note-form>
        <div class="editor-head">
          <input name="title" class="title-input" placeholder="Untitled">
          <div class="toolbar-actions">
            <button class="secondary" type="button" data-cancel-edit>取消</button>
            <button type="submit">保存</button>
          </div>
        </div>
        <label>
          来源链接
          <input name="source_url" placeholder="https://...">
        </label>
        <label>
          Markdown
          <textarea name="body_md" rows="18" placeholder="# 标题&#10;&#10;写下你的笔记..."></textarea>
        </label>
      </form>
    </section>
  </article>
</section>

<script type="application/json" id="notes-data">{{ notes|tojson }}</script>
<script type="application/json" id="tree-data">{{ tree|tojson }}</script>
<script type="application/json" id="directories-data">{{ directories|tojson }}</script>
{% endblock %}
