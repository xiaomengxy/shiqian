{% macro render_directory_tree(nodes, selected_id, query="") %}
  {% for node in nodes %}
    <li>
      <a
        class="tree-node {% if selected_id == node.id %}active{% endif %}"
        href="/directories?selected={{ node.id }}{% if query %}&query={{ query|urlencode }}{% endif %}"
        data-partial-link
        data-target="#directory-workspace"
      >
        <span class="tree-name">{{ node.name }}</span>
        <span class="tree-count">{{ node.count }}</span>
      </a>
      {% if node.children %}
        <ul>
          {{ render_directory_tree(node.children, selected_id, query) }}
        </ul>
      {% endif %}
    </li>
  {% endfor %}
{% endmacro %}
